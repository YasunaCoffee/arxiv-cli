name: Daily arXiv Fetch

on:
  schedule:
    - cron: '0 3 * * *'  # 毎日 JST 12:00
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arx
        run: pip install -e .

      # AlphaXiv MCPで2025年のAIキャラクター論文を取得 → DBに保存 → Discord通知
      - name: Fetch & Notify
        run: python scripts/fetch_ai_character.py | python scripts/notify_discord.py
        env:
          ARX_DB_PATH: ./data/papers.db
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/papers.db ] && git add data/papers.db || echo "data/papers.db not found, skipping"
          git diff --cached --quiet || (git commit -m "chore: daily fetch $(date +%Y-%m-%d)" && git push)
