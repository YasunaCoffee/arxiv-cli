name: Daily RSS Fetch

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日 JST 7:00
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arxiv-data
        uses: actions/checkout@v4
        with:
          repository: YasunaCoffee/arxiv-data
          token: ${{ secrets.GH_PAT }}
          path: arxiv-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arx
        run: pip install -e .

      - name: Fetch RSS papers
        run: python scripts/fetch_rss_papers.py > /tmp/rss_papers.json
        env:
          ARX_DB_PATH: ./arxiv-data/papers.db

      - name: Notify Discord
        run: python scripts/notify_discord.py < /tmp/rss_papers.json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Push updated DB to arxiv-data
        run: |
          cd arxiv-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers.db
          git diff --cached --quiet || (git commit -m "chore: rss fetch $(date +%Y-%m-%d)" && git push)
