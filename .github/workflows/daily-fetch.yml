name: Daily RSS Fetch

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日 JST 7:00
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arx
        run: pip install -e .

      - name: Fetch RSS papers
        run: python scripts/fetch_rss_papers.py > /tmp/rss_papers.json
        env:
          ARX_DB_PATH: ./data/papers.db

      - name: Notify Discord
        run: python scripts/notify_discord.py < /tmp/rss_papers.json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/papers.db ] && git add data/papers.db || echo "data/papers.db not found, skipping"
          git diff --cached --quiet || (git commit -m "chore: rss fetch $(date +%Y-%m-%d)" && git push)
