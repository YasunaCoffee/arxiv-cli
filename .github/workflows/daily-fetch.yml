name: Daily arXiv Fetch

on:
  schedule:
    - cron: '0 3 * * *'  # 毎日 JST 12:00
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install arx
        run: pip install -e .

      # --- RSS新着論文 ---
      - name: Fetch RSS papers
        run: python scripts/fetch_rss_papers.py > /tmp/rss_papers.json
        env:
          ARX_DB_PATH: ./data/papers.db

      - name: Notify RSS papers
        run: python scripts/notify_discord.py < /tmp/rss_papers.json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # --- AIキャラクター論文検索 ---
      - name: Fetch AI character papers
        run: python scripts/fetch_ai_character.py > /tmp/ai_papers.json
        env:
          ARX_DB_PATH: ./data/papers.db

      - name: Notify AI character papers
        run: python scripts/notify_discord.py < /tmp/ai_papers.json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # --- DB保存 ---
      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/papers.db ] && git add data/papers.db || echo "data/papers.db not found, skipping"
          git diff --cached --quiet || (git commit -m "chore: daily fetch $(date +%Y-%m-%d)" && git push)
