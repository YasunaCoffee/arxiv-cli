[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arx"
version = "0.1.0"
description = "arXiv論文管理CLIツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "fastmcp>=2.0",
]

[project.scripts]
arx = "arx.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
